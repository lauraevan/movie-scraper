name: Add CineJoy provider once

on:
  push:
    paths:
      - '.github/workflows/add-cinejoy-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add CineJoy provider
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('cinplayer.sources.js')
          text = path.read_text()
          marker = "  var defs = ["
          start = text.index(marker)
          end = text.index("\n  ];", start)
          block = text[start:end]

          if "['cinejoy'" not in block:
              entry = "    ['cinejoy','CineJoy','#d8a6ff','CineJoy','https://cinejoy.to/watch/movie/{id}','https://cinejoy.to/watch/tv/{id}/{season}/{episode}']"
              text = text[:end] + ",\n" + entry + text[end:]
              path.write_text(text)
          PY

      - name: Validate JavaScript
        run: node --check cinplayer.sources.js

      - name: Commit provider and clean workflow
        shell: bash
        run: |
          rm -f .github/workflows/add-cinejoy-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add CineJoy provider"
          git push
