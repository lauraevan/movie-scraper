<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CinPlayer</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<script src="/cinplayer.sources.js"></script>
<style>
:root{
  --bg:#050505;
  --panel:#090909;
  --panel2:#0d0d0d;
  --line:#1b1b1b;
  --line2:#262626;
  --text:#f4f4f4;
  --muted:#777;
  --soft:#555;
  --failed:#ff5d66;
  --ok:#7bd88f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
button,input{font:inherit}button{cursor:pointer}
#app{position:fixed;inset:0;background:#000}
#video,#embed{position:absolute;inset:0;width:100%;height:100%;background:#000;border:0}
#video{object-fit:contain}
#embed{display:none}

/* resolver */
#resolver{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:#050505;transition:opacity .16s ease,visibility .16s ease}
#resolver.hidden{opacity:0;visibility:hidden;pointer-events:none}
.resolveCard{width:min(420px,94vw);max-height:min(680px,90vh);overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.resolveHead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.resolveHead h1{font-size:15px;font-weight:720;letter-spacing:-.02em}
#resolveStatus{font-size:11px;color:var(--muted);margin-top:3px}
#sourceList{padding:6px;overflow:auto;max-height:calc(min(680px,90vh) - 62px)}
.sourceRow{--accent:#777;min-height:38px;display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:8px;border-left:2px solid transparent;animation:rowIn .16s ease both;transition:background .12s ease,border-color .12s ease,opacity .12s ease}
@keyframes rowIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.sourceRow.checking{background:#111;border-left-color:var(--accent)}
.sourceRow.failed{opacity:.72}
.sourceDot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.sourceName{font-size:12px;font-weight:650;flex:1;min-width:0}
.sourceState{font-size:10px;color:var(--soft);text-transform:lowercase}
.sourceState.checking{color:#bdbdbd}
.sourceState.failed{color:var(--failed);font-weight:700}
.sourceState.playing{color:var(--ok);font-weight:700}

/* tiny top controls */
#mini{position:fixed;z-index:45;top:max(9px,env(safe-area-inset-top));right:10px;display:none;align-items:center;gap:5px}
#mini.visible{display:flex}
#activeDot{width:8px;height:8px;border-radius:50%;background:#777;border:1px solid #000}
.iconTop{width:30px;height:30px;border:1px solid var(--line2);border-radius:9px;background:#0a0a0a;color:#ddd;display:grid;place-items:center;font-size:16px;line-height:1;padding:0}
.iconTop:hover{background:#111}
#menu{position:fixed;z-index:60;top:max(45px,calc(env(safe-area-inset-top) + 36px));right:10px;width:min(260px,88vw);max-height:min(72vh,520px);overflow:auto;display:none;padding:6px;border:1px solid var(--line2);border-radius:12px;background:#0a0a0a}
#menu.visible{display:block;animation:menuIn .12s ease both}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.menuCurrent{padding:8px 9px 9px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menuCurrent strong{font-size:12px}.menuCurrent small{display:block;margin-top:2px;color:var(--muted);font-size:9px}
.menuAction,.menuSource{width:100%;border:0;background:transparent;color:#ddd;border-radius:8px;padding:8px 9px;display:flex;align-items:center;gap:9px;text-align:left}
.menuAction:hover,.menuSource:hover{background:#121212}
.menuAction span:first-child{width:16px;color:#888;text-align:center}
.menuSource .mDot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.menuSource .mName{flex:1;font-size:11px;font-weight:620}
.menuSource small{font-size:9px;color:var(--soft)}
.menuSource.failed small{color:var(--failed)}
.menuSource.playing{background:#111}.menuSource.playing small{color:var(--ok)}
.menuDivider{height:1px;background:var(--line);margin:4px 3px}

/* compact native controls */
#nativeControls{position:fixed;z-index:40;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:none;align-items:center;gap:8px;padding:8px;border:1px solid var(--line2);border-radius:12px;background:#0a0a0a;transition:opacity .16s ease}
#nativeControls.visible{display:flex}
#nativeControls.idle{opacity:0;pointer-events:none}
.controlIcon{width:31px;height:31px;border:0;border-radius:8px;background:#151515;color:#eee;display:grid;place-items:center}
#playBtn{background:#eee;color:#080808;font-weight:800}
#seek{flex:1;min-width:70px;accent-color:#ddd;height:14px}
#time{font-size:10px;color:#777;min-width:76px;text-align:right;font-variant-numeric:tabular-nums}
#qualityBtn{border:0;border-radius:8px;background:#151515;color:#ddd;padding:7px 8px;font-size:10px}
#qualityMenu{position:fixed;z-index:65;right:10px;bottom:max(52px,calc(env(safe-area-inset-bottom) + 48px));width:150px;display:none;padding:5px;border:1px solid var(--line2);border-radius:10px;background:#0a0a0a}
#qualityMenu.visible{display:block}
.qRow{width:100%;border:0;background:transparent;color:#ddd;border-radius:7px;padding:7px 8px;display:flex;justify-content:space-between;font-size:10px}.qRow:hover,.qRow.selected{background:#151515}.qRow span:last-child{color:#666}

#usage,#fatal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:#050505;padding:24px;gap:12px}
#usage h2,#fatal h2{font-size:18px}#usage p,#fatal p{max-width:540px;color:#777;font-size:12px;line-height:1.65}#usage a,#fatal button{border:1px solid var(--line2);background:#0e0e0e;color:#ddd;border-radius:9px;padding:9px 12px;text-decoration:none}
#debug{position:fixed;z-index:100;left:8px;bottom:8px;display:none;max-width:min(720px,calc(100vw - 16px));max-height:28vh;overflow:auto;padding:7px 9px;border:1px solid #222;border-radius:8px;background:#050505;color:#777;font:9px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;pointer-events:none}

@media(max-width:620px){
  #nativeControls{left:6px;right:6px;bottom:max(6px,env(safe-area-inset-bottom));gap:5px;padding:6px}
  #time{min-width:64px;font-size:9px}
  #qualityBtn{padding:7px 6px}
  .resolveCard{width:min(390px,96vw)}
}
</style>
</head>
<body>
<div id="app">
  <video id="video" playsinline preload="auto"></video>
  <iframe id="embed" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen referrerpolicy="origin-when-cross-origin"></iframe>
</div>

<section id="resolver">
  <div class="resolveCard">
    <div class="resolveHead">
      <div><h1>CinPlayer</h1><div id="resolveStatus">Finding a source</div></div>
    </div>
    <div id="sourceList"></div>
  </div>
</section>

<div id="mini">
  <span id="activeDot"></span>
  <button class="iconTop" id="menuBtn" aria-label="Player menu">⋯</button>
</div>

<div id="menu"></div>

<div id="nativeControls">
  <button class="controlIcon" id="playBtn" aria-label="Play">▶</button>
  <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
  <span id="time">0:00 / 0:00</span>
  <button id="qualityBtn">Auto</button>
  <button class="controlIcon" id="muteBtn" aria-label="Mute">◖</button>
  <button class="controlIcon" id="fsBtn" aria-label="Fullscreen">⛶</button>
</div>
<div id="qualityMenu"></div>

<section id="usage"><h2>CinPlayer</h2><p>Use <code>?id=550</code> for a movie or <code>?id=1399&amp;s=1&amp;e=1</code> for TV. CinPlayer automatically walks the animal source list and stops as soon as one loads.</p><a href="/?test=1&amp;debug=1">Run player test</a></section>
<section id="fatal"><h2>No source worked</h2><p id="fatalText">CinPlayer reached the bottom of the list.</p><button onclick="location.reload()">Try again</button></section>
<div id="debug"></div>

<script>
'use strict';

var params=new URLSearchParams(location.search);
var context={id:params.get('id'),season:params.get('s'),episode:params.get('e')||'1',test:params.get('test')==='1',params:params};
var DEBUG=params.get('debug')==='1';
var EMBED_TIMEOUT=Math.max(800,Math.min(6000,Number(params.get('timeout')||1800)));
var SOURCES=Array.isArray(window.CINPLAYER_SOURCE_ADAPTERS)?window.CINPLAYER_SOURCE_ADAPTERS:[];

var video=document.getElementById('video');
var embed=document.getElementById('embed');
var resolver=document.getElementById('resolver');
var sourceList=document.getElementById('sourceList');
var resolveStatus=document.getElementById('resolveStatus');
var mini=document.getElementById('mini');
var activeDot=document.getElementById('activeDot');
var menu=document.getElementById('menu');
var menuBtn=document.getElementById('menuBtn');
var nativeControls=document.getElementById('nativeControls');
var qualityMenu=document.getElementById('qualityMenu');
var qualityBtn=document.getElementById('qualityBtn');
var debugEl=document.getElementById('debug');

var hls=null;
var currentIndex=-1;
var currentAdapter=null;
var currentCandidate=null;
var states={};
var attemptSerial=0;
var falling=false;
var embedTimer=null;
var currentQuality=-1;
var idleTimer=null;

if(DEBUG)debugEl.style.display='block';

function log(message){
  console.log('[CinPlayer]',message);
  if(DEBUG){
    debugEl.textContent+='['+new Date().toLocaleTimeString()+'] '+message+'\n';
    debugEl.scrollTop=debugEl.scrollHeight;
  }
}

function fmt(t){
  if(!Number.isFinite(t)||t<0)return'0:00';
  t=Math.floor(t);
  var h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;
  return(h?h+':':'')+(h?String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0');
}

function qName(w,h){
  w=Number(w||0);h=Number(h||0);
  if(w>=7680||h>=4320)return'8K';
  if(w>=5120||h>=2880)return'5K';
  if(w>=3840||h>=2160)return'4K';
  if(h>=1440)return'1440p';
  if(h>=1080)return'1080p';
  if(h>=720)return'720p';
  return h?h+'p':'Auto';
}

function rowFor(id){return document.querySelector('[data-source="'+id+'"]')}

function setState(adapter,state){
  states[adapter.id]=state;
  var row=rowFor(adapter.id);
  if(row){
    row.classList.remove('checking','failed','playing');
    if(state)row.classList.add(state);
    var st=row.querySelector('.sourceState');
    st.className='sourceState '+(state||'');
    st.textContent=state==='failed'?'failed':state==='checking'?'checking…':state==='playing'?'playing':'';
  }
  renderMenu();
}

function renderRows(){
  sourceList.innerHTML='';
  SOURCES.forEach(function(source,index){
    states[source.id]='';
    var row=document.createElement('div');
    row.className='sourceRow';
    row.dataset.source=source.id;
    row.style.setProperty('--accent',source.color||'#777');
    row.style.animationDelay=Math.min(index*12,180)+'ms';
    row.innerHTML='<span class="sourceDot"></span><span class="sourceName">'+source.label+'</span><span class="sourceState"></span>';
    sourceList.appendChild(row);
  });
}

function renderMenu(){
  menu.innerHTML='';
  var current=document.createElement('div');
  current.className='menuCurrent';
  current.innerHTML='<strong>'+(currentAdapter?currentAdapter.label:'CinPlayer')+'</strong><small>'+(currentAdapter?'active source':'automatic source selection')+'</small>';
  menu.appendChild(current);

  var next=document.createElement('button');
  next.className='menuAction';
  next.innerHTML='<span>↓</span><span>Next source</span>';
  next.onclick=function(){menu.classList.remove('visible');failCurrent('manual next')};
  menu.appendChild(next);

  var fs=document.createElement('button');
  fs.className='menuAction';
  fs.innerHTML='<span>⛶</span><span>Fullscreen</span>';
  fs.onclick=function(){menu.classList.remove('visible');toggleFullscreen()};
  menu.appendChild(fs);

  var divider=document.createElement('div');
  divider.className='menuDivider';
  menu.appendChild(divider);

  SOURCES.forEach(function(source,index){
    var state=states[source.id]||'';
    var button=document.createElement('button');
    button.className='menuSource '+state;
    button.style.setProperty('--accent',source.color||'#777');
    button.innerHTML='<span class="mDot"></span><span class="mName">'+source.label+'</span><small>'+(state||'')+'</small>';
    button.onclick=function(){menu.classList.remove('visible');switchTo(index)};
    menu.appendChild(button);
  });
}

function cleanup(){
  attemptSerial++;
  clearTimeout(embedTimer);embedTimer=null;
  if(hls){try{hls.destroy()}catch(_){ }hls=null}
  try{video.pause()}catch(_){ }
  video.removeAttribute('src');
  try{video.load()}catch(_){ }
  video.style.display='none';
  embed.onload=null;
  embed.onerror=null;
  embed.src='about:blank';
  embed.style.display='none';
  nativeControls.classList.remove('visible');
  qualityMenu.classList.remove('visible');
}

function showPlaying(adapter){
  currentAdapter=adapter;
  activeDot.style.background=adapter.color||'#777';
  mini.classList.add('visible');
  resolver.classList.add('hidden');
  resolveStatus.textContent='Playing '+adapter.label;
  renderMenu();
}

function playEmbed(candidate,adapter){
  return new Promise(function(resolve){
    cleanup();
    var serial=attemptSerial;
    embed.style.display='block';

    var settled=false;
    function finish(ok,reason){
      if(settled||serial!==attemptSerial)return;
      settled=true;
      clearTimeout(embedTimer);embedTimer=null;
      embed.onload=null;
      if(!ok){
        embed.onerror=null;
        embed.src='about:blank';
        embed.style.display='none';
      }
      log(adapter.label+' '+(ok?'loaded':'failed')+(reason?' · '+reason:''));
      resolve(ok);
    }

    embed.onload=function(){finish(true,'load')};
    embed.onerror=function(){finish(false,'iframe error')};
    embedTimer=setTimeout(function(){finish(false,'timeout')},EMBED_TIMEOUT);
    embed.src=candidate.url;
  });
}

function rebuildQuality(){
  qualityMenu.innerHTML='';
  if(!hls||!hls.levels||!hls.levels.length){qualityBtn.textContent='Auto';return}

  function add(label,index,detail){
    var b=document.createElement('button');
    b.className='qRow '+(currentQuality===index?'selected':'');
    b.innerHTML='<span>'+label+'</span><span>'+(detail||'')+'</span>';
    b.onclick=function(){
      currentQuality=index;
      hls.currentLevel=index;
      if(index===-1){hls.nextLevel=-1;qualityBtn.textContent='Auto'}else qualityBtn.textContent=label;
      qualityMenu.classList.remove('visible');
      rebuildQuality();
    };
    qualityMenu.appendChild(b);
  }

  add('Auto',-1,'adaptive');
  hls.levels.map(function(level,index){return{level:level,index:index}}).sort(function(a,b){return(b.level.height||0)-(a.level.height||0)}).forEach(function(item){
    add(qName(item.level.width,item.level.height),item.index,item.level.bitrate?Math.round(item.level.bitrate/1000000)+'M':'');
  });
}

function playNative(candidate,adapter){
  return new Promise(function(resolve){
    cleanup();
    var serial=attemptSerial;
    video.style.display='block';
    nativeControls.classList.add('visible');
    var settled=false;
    var timeout=setTimeout(function(){finish(false,'native timeout')},5000);

    function finish(ok,reason){
      if(settled||serial!==attemptSerial)return;
      settled=true;clearTimeout(timeout);
      log(adapter.label+' '+(ok?'ready':'failed')+(reason?' · '+reason:''));
      resolve(ok);
    }

    if(candidate.type==='hls'&&window.Hls&&Hls.isSupported()){
      hls=new Hls({enableWorker:true,startLevel:-1,manifestLoadingTimeOut:4000,levelLoadingTimeOut:4000,fragLoadingTimeOut:6000,manifestLoadingMaxRetry:1,levelLoadingMaxRetry:1,fragLoadingMaxRetry:2});
      hls.on(Hls.Events.MANIFEST_PARSED,function(){rebuildQuality();finish(true,'manifest');video.play().catch(function(){})});
      hls.on(Hls.Events.ERROR,function(_,data){
        if(!data.fatal)return;
        if(!settled){finish(false,data.details||'HLS error');return}
        if(data.type===Hls.ErrorTypes.MEDIA_ERROR){try{hls.recoverMediaError();return}catch(_){ }}
        failCurrent(data.details||'HLS runtime error');
      });
      hls.loadSource('/api?url='+encodeURIComponent(candidate.url));
      hls.attachMedia(video);
      return;
    }

    video.src=candidate.type==='mp4'?candidate.url:'/api?url='+encodeURIComponent(candidate.url);
    video.addEventListener('canplay',function(){finish(true,'canplay');video.play().catch(function(){})},{once:true});
    video.addEventListener('error',function(){finish(false,'media error')},{once:true});
  });
}

async function attempt(index){
  var adapter=SOURCES[index];
  currentIndex=index;
  currentAdapter=adapter;
  resolveStatus.textContent='Checking '+adapter.label;
  setState(adapter,'checking');
  var row=rowFor(adapter.id);if(row)row.scrollIntoView({block:'nearest',behavior:'smooth'});

  try{
    var candidate=await adapter.resolve(context);
    if(!candidate||!candidate.url)throw new Error('no route');
    currentCandidate=candidate;
    var ok=candidate.type==='embed'?await playEmbed(candidate,adapter):await playNative(candidate,adapter);
    if(!ok)throw new Error('did not load');
    setState(adapter,'playing');
    showPlaying(adapter);
    return true;
  }catch(error){
    log(adapter.label+' failed: '+error.message);
    setState(adapter,'failed');
    return false;
  }
}

async function tryFrom(start){
  if(falling)return;
  falling=true;
  resolver.classList.remove('hidden');
  mini.classList.remove('visible');

  for(var i=start;i<SOURCES.length;i++){
    var ok=await attempt(i);
    if(ok){falling=false;return true}
  }

  falling=false;
  cleanup();
  resolver.classList.add('hidden');
  document.getElementById('fatal').style.display='flex';
  return false;
}

async function switchTo(index){
  if(index<0||index>=SOURCES.length)return;
  falling=false;
  resolver.classList.remove('hidden');
  mini.classList.remove('visible');
  cleanup();
  var ok=await attempt(index);
  if(!ok)tryFrom(index+1);
}

function failCurrent(reason){
  if(falling)return;
  if(currentAdapter)setState(currentAdapter,'failed');
  log('Current source failed: '+reason);
  resolver.classList.remove('hidden');
  mini.classList.remove('visible');
  cleanup();
  tryFrom(currentIndex+1);
}

function toggleFullscreen(){
  if(document.fullscreenElement){document.exitFullscreen().catch(function(){})}
  else document.documentElement.requestFullscreen().catch(function(){})
}

menuBtn.onclick=function(e){e.stopPropagation();menu.classList.toggle('visible')};
document.addEventListener('click',function(){menu.classList.remove('visible');qualityMenu.classList.remove('visible')});
menu.addEventListener('click',function(e){e.stopPropagation()});
qualityMenu.addEventListener('click',function(e){e.stopPropagation()});

/* Some embed players voluntarily post errors to their parent. When they do,
   CinPlayer can skip them automatically without inspecting cross-origin DOM. */
window.addEventListener('message',function(event){
  if(!currentCandidate||currentCandidate.type!=='embed'||falling)return;
  var text='';
  try{text=typeof event.data==='string'?event.data:JSON.stringify(event.data)}catch(_){return}
  if(!text)return;
  text=text.toLowerCase();
  if(/no source|not found|unavailable|playback failed|fatal error/.test(text))failCurrent('embed reported failure');
});

/* native controls */
var playBtn=document.getElementById('playBtn'),seek=document.getElementById('seek'),time=document.getElementById('time'),muteBtn=document.getElementById('muteBtn'),fsBtn=document.getElementById('fsBtn');
playBtn.onclick=function(){if(video.paused)video.play().catch(function(){});else video.pause()};
muteBtn.onclick=function(){video.muted=!video.muted;muteBtn.textContent=video.muted?'×':'◖'};
fsBtn.onclick=toggleFullscreen;
qualityBtn.onclick=function(e){e.stopPropagation();if(hls)qualityMenu.classList.toggle('visible')};
video.addEventListener('play',function(){playBtn.textContent='Ⅱ'});
video.addEventListener('pause',function(){playBtn.textContent='▶'});
video.addEventListener('timeupdate',function(){
  if(Number.isFinite(video.duration)&&video.duration>0){seek.value=Math.round(video.currentTime/video.duration*1000);time.textContent=fmt(video.currentTime)+' / '+fmt(video.duration)}
});
seek.oninput=function(){if(Number.isFinite(video.duration)&&video.duration>0)video.currentTime=Number(seek.value)/1000*video.duration};

function showNativeControls(){
  if(currentCandidate&&currentCandidate.type!=='embed'){
    nativeControls.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer=setTimeout(function(){nativeControls.classList.add('idle')},2400);
  }
}
document.addEventListener('mousemove',showNativeControls);
document.addEventListener('touchstart',showNativeControls,{passive:true});

renderRows();
renderMenu();

if(!context.id&&!context.test){
  resolver.style.display='none';
  document.getElementById('usage').style.display='flex';
}else{
  tryFrom(0);
}
</script>
</body>
</html>
