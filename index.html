<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stream</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff; overflow: hidden; }

#loader {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 24px; background: #000;
}
#loader-bg {
  position: absolute; inset: -24px;
  background-size: cover; background-position: center;
  filter: blur(12px); transform: scale(1.05);
  transition: opacity .6s ease; opacity: 0;
}
#loader::after {
  content: ""; position: absolute; inset: 0;
  background: rgba(0,0,0,.58);
}
.spinner {
  position: relative; z-index: 2;
  width: 64px; height: 64px;
  border: 4px solid rgba(255,255,255,.15);
  border-top-color: #fff; border-radius: 50%;
  animation: spin .9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loader-text { position: relative; z-index: 2; font-size: .95rem; color: rgba(255,255,255,.72); letter-spacing: .02em; text-shadow: 0 1px 4px #000; }
#loader-stage { position: relative; z-index: 2; margin-top: -14px; font-size: .75rem; color: rgba(255,255,255,.38); }

#player { position: fixed; inset: 0; display: none; background: #000; }
video { width: 100%; height: 100%; display: block; background: #000; }

#usage, #err {
  position: fixed; inset: 0; display: none; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  background: #050505; gap: 14px; padding: 28px;
}
#usage p { font-size: 1rem; color: rgba(255,255,255,.65); line-height: 2; }
#usage a, #err button {
  border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.07);
  color: #fff; text-decoration: none; border-radius: 10px; padding: 10px 14px;
  cursor: pointer; font: inherit;
}
#err-title { font-size: 2rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
#err-detail { max-width: 720px; font-size: .85rem; line-height: 1.5; color: rgba(255,255,255,.46); overflow-wrap: anywhere; }
#err-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }

#debug {
  position: fixed; left: 12px; bottom: 12px; z-index: 20; display: none;
  max-width: min(720px, calc(100vw - 24px)); padding: 9px 11px;
  border-radius: 9px; background: rgba(0,0,0,.72); color: rgba(255,255,255,.7);
  font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
  white-space: pre-wrap; overflow-wrap: anywhere; pointer-events: none;
}
</style>
</head>
<body>

<div id="loader">
  <div id="loader-bg"></div>
  <div class="spinner"></div>
  <div id="loader-text">Loading stream...</div>
  <div id="loader-stage">Starting player</div>
</div>

<div id="usage">
  <p>
    <span style="color:#fff;font-size:1.2rem">Stream</span><br><br>
    <code style="color:rgba(255,255,255,.85)">?id=550</code> &nbsp; movie<br>
    <code style="color:rgba(255,255,255,.85)">?id=456&amp;s=1&amp;e=1</code> &nbsp; TV episode<br>
    <code style="color:rgba(255,255,255,.85)">?test=1</code> &nbsp; player self-test
  </p>
  <a href="/?test=1">Run Player Self-Test</a>
</div>

<div id="err">
  <div id="err-title">Playback failed</div>
  <div id="err-detail"></div>
  <div id="err-actions">
    <button id="retry-btn">Retry</button>
    <button id="test-btn">Run self-test</button>
  </div>
</div>

<div id="player">
  <video id="v" controls autoplay playsinline preload="auto"></video>
</div>

<div id="debug"></div>

<script>
var TMDB_KEY = '3a73619bbb8fc6d47742d1b5b2b707b5';

var MESSAGES = [
  'Loading stream...', 'Contacting the server...', 'Checking playback route...',
  'Reading the manifest...', 'Warming up the player...', 'Almost there...'
];

var p = new URLSearchParams(location.search);
var id = p.get('id');
var s = p.get('s');
var e = p.get('e');
var testMode = p.get('test') === '1';
var debugMode = p.get('debug') === '1';

var msgEl = document.getElementById('loader-text');
var stageEl = document.getElementById('loader-stage');
var debugEl = document.getElementById('debug');
var msgIdx = 0;
var hls = null;
var started = false;
var fatalShown = false;

if (debugMode) debugEl.style.display = 'block';

function logDebug(message) {
  var stamp = new Date().toLocaleTimeString();
  console.log('[player]', message);
  if (debugMode) {
    debugEl.textContent += '[' + stamp + '] ' + message + '\n';
  }
}

var msgTimer = setInterval(function() {
  msgIdx = (msgIdx + 1) % MESSAGES.length;
  msgEl.textContent = MESSAGES[msgIdx];
}, 2200);

function setStage(message) {
  stageEl.textContent = message;
  logDebug(message);
}

function showPlayer() {
  if (started) return;
  started = true;
  clearInterval(msgTimer);
  document.getElementById('loader').style.display = 'none';
  document.getElementById('err').style.display = 'none';
  document.getElementById('player').style.display = 'block';
}

function showErr(message) {
  if (fatalShown) return;
  fatalShown = true;
  clearInterval(msgTimer);
  document.getElementById('loader').style.display = 'none';
  document.getElementById('player').style.display = 'none';
  document.getElementById('err').style.display = 'flex';
  document.getElementById('err-detail').textContent = message || 'Unknown playback error';
  logDebug('ERROR: ' + (message || 'unknown'));
}

document.getElementById('retry-btn').onclick = function() {
  location.reload();
};

document.getElementById('test-btn').onclick = function() {
  location.href = '/?test=1&debug=1';
};

function loadBackdrop(mediaId, isTv) {
  if (!mediaId) return;

  var type = isTv ? 'tv' : 'movie';
  fetch('https://api.themoviedb.org/3/' + type + '/' + encodeURIComponent(mediaId) + '?api_key=' + encodeURIComponent(TMDB_KEY))
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(d) {
      if (!d) return;
      var img = d.backdrop_path || d.poster_path;
      if (!img) return;
      var bg = document.getElementById('loader-bg');
      var url = 'https://image.tmdb.org/t/p/w1280' + img;
      var preload = new Image();
      preload.onload = function() {
        bg.style.backgroundImage = 'url("' + url + '")';
        bg.style.opacity = '1';
      };
      preload.src = url;
    })
    .catch(function() {});
}

function requestJson(url, timeoutMs) {
  var controller = new AbortController();
  var timer = setTimeout(function() { controller.abort(); }, timeoutMs || 15000);

  return fetch(url, { signal: controller.signal })
    .then(function(response) {
      return response.text().then(function(text) {
        clearTimeout(timer);
        var data;
        try { data = JSON.parse(text); }
        catch (_) { throw new Error('API returned invalid JSON (HTTP ' + response.status + ')'); }

        if (!response.ok) {
          throw new Error((data && data.error) || ('API returned HTTP ' + response.status));
        }
        return data;
      });
    })
    .catch(function(error) {
      clearTimeout(timer);
      if (error.name === 'AbortError') throw new Error('API request timed out');
      throw error;
    });
}

function buildLookupUrl() {
  var params = new URLSearchParams();
  params.set('id', id);
  if (s) {
    params.set('s', s);
    params.set('e', e || '1');
  }
  return '/api?' + params.toString();
}

function start() {
  if (testMode) {
    setStage('Requesting public test stream');
    requestJson('/api?test=1', 10000)
      .then(function(data) {
        if (!data.url) throw new Error('Self-test API returned no URL');
        setStage('Starting player self-test');
        play(data.url);
      })
      .catch(function(error) { showErr(error.message); });
    return;
  }

  if (!id) {
    clearInterval(msgTimer);
    document.getElementById('loader').style.display = 'none';
    document.getElementById('usage').style.display = 'flex';
    return;
  }

  loadBackdrop(id, !!s);
  setStage('Resolving stream');

  requestJson(buildLookupUrl(), 20000)
    .then(function(data) {
      if (!data.url) throw new Error(data.error || 'Resolver returned no playback URL');
      setStage('Stream resolved; loading manifest');
      play(data.url);
    })
    .catch(function(error) {
      showErr('Resolver failed: ' + error.message + '. Try ?test=1 to verify the player and proxy independently.');
    });
}

function play(rawUrl) {
  fatalShown = false;
  var src = '/api?url=' + encodeURIComponent(rawUrl);
  var v = document.getElementById('v');

  logDebug('Source: ' + rawUrl);
  logDebug('Proxy: ' + src);

  if (Hls.isSupported()) {
    if (hls) hls.destroy();

    hls = new Hls({
      enableWorker: true,
      startLevel: -1,
      manifestLoadingTimeOut: 15000,
      levelLoadingTimeOut: 15000,
      fragLoadingTimeOut: 20000,
      manifestLoadingMaxRetry: 2,
      levelLoadingMaxRetry: 2,
      fragLoadingMaxRetry: 3
    });

    hls.on(Hls.Events.MANIFEST_LOADING, function() {
      setStage('Loading HLS manifest');
    });

    hls.on(Hls.Events.MANIFEST_PARSED, function(_, data) {
      var levels = data && data.levels ? data.levels : [];
      var maxHeight = levels.reduce(function(max, level) {
        return Math.max(max, Number(level.height || 0));
      }, 0);
      logDebug('Manifest parsed; levels=' + levels.length + ', maxHeight=' + maxHeight);
      setStage(maxHeight ? ('Ready · up to ' + maxHeight + 'p') : 'Ready');
      showPlayer();
      v.play().catch(function(error) {
        logDebug('Autoplay blocked: ' + error.message);
      });
    });

    hls.on(Hls.Events.ERROR, function(_, data) {
      var detail = data && data.details ? data.details : 'unknown';
      logDebug('HLS event: ' + detail + (data.fatal ? ' (fatal)' : ''));

      if (!data.fatal) return;

      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
        try {
          setStage('Network error; retrying');
          hls.startLoad();
          return;
        } catch (_) {}
      }

      if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        try {
          setStage('Media error; recovering');
          hls.recoverMediaError();
          return;
        } catch (_) {}
      }

      showErr('HLS fatal error: ' + detail + '. Open with ?debug=1 for diagnostics.');
    });

    hls.loadSource(src);
    hls.attachMedia(v);
    return;
  }

  if (v.canPlayType('application/vnd.apple.mpegurl')) {
    setStage('Using native HLS playback');
    v.src = src;
    v.addEventListener('loadedmetadata', function() {
      showPlayer();
      v.play().catch(function() {});
    }, { once: true });
    v.addEventListener('error', function() {
      var code = v.error ? v.error.code : 'unknown';
      showErr('Native HLS playback failed (media error ' + code + ')');
    }, { once: true });
    return;
  }

  showErr('This browser does not support HLS playback');
}

start();
</script>
</body>
</html>
